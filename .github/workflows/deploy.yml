name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instaliraj ovisnosti
        run: npm ci

      - name: Postavi GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Izgradi stranicu
        run: npm run build

      - name: Pošalji build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Objavi
        id: deployment
        uses: actions/deploy-pages@v4
